name: Validate Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/validate-infra.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Bicep against Azure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get PostgreSQL admin password from Key Vault
        id: get-pg-password
        run: |
          PG_PASSWORD=$(az keyvault secret show \
            --vault-name kv-millet-dev-mxc-01 \
            --name postgres-admin-password \
            --query value \
            --output tsv)
          echo "::add-mask::$PG_PASSWORD"
          echo "pg_password=$PG_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Build Bicep templates
        run: |
          az bicep build --file infra/main.bicep
          echo "Bicep compilation successful"

      - name: Validate deployment
        run: |
          az deployment sub validate \
            --location mexicocentral \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters postgresAdminPassword="${{ steps.get-pg-password.outputs.pg_password }}" \
            --output table

      - name: Run what-if analysis
        id: whatif
        run: |
          set -o pipefail
          az deployment sub what-if \
            --location mexicocentral \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters postgresAdminPassword="${{ steps.get-pg-password.outputs.pg_password }}" \
            > whatif-full.txt 2>&1 || true

          # Resumen: contar recursos por tipo de operacion
          echo "## What-If Summary" > whatif-summary.md
          echo "" >> whatif-summary.md

          CREATE_COUNT=$(grep -cE "^[[:space:]]*\+ " whatif-full.txt || true)
          MODIFY_COUNT=$(grep -cE "^[[:space:]]*~ " whatif-full.txt || true)
          DELETE_COUNT=$(grep -cE "^[[:space:]]*- " whatif-full.txt || true)
          NOCHANGE_COUNT=$(grep -cE "^[[:space:]]*= " whatif-full.txt || true)

          echo "| Operation | Count |" >> whatif-summary.md
          echo "|-----------|-------|" >> whatif-summary.md
          echo "| 🟢 Create | $CREATE_COUNT |" >> whatif-summary.md
          echo "| 🟡 Modify | $MODIFY_COUNT |" >> whatif-summary.md
          echo "| 🔴 Delete | $DELETE_COUNT |" >> whatif-summary.md
          echo "| ⚪ No change | $NOCHANGE_COUNT |" >> whatif-summary.md
          echo "" >> whatif-summary.md
          echo "Detalle completo en los logs del workflow." >> whatif-summary.md
          echo "" >> whatif-summary.md

          cat whatif-summary.md

          # Guardar el resumen como output
          {
            echo 'summary<<EOF'
            cat whatif-summary.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment what-if summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.whatif.outputs.summary }}`;

            // Buscar comentario previo del bot para actualizarlo
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('What-If Summary')
            );

            const body = `${summary}\n\n_Generated by validate-infra workflow at ${new Date().toISOString()}_`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Upload what-if details as artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatif-details
          path: whatif-full.txt
          retention-days: 14
