# Configuración de SonarCloud (análisis automático).
#
# Las migraciones de EF Core son código generado: cada *.Designer.cs repite
# casi completo el ModelSnapshot, así que un PR con varias migraciones
# dispara la métrica de duplicación sin que haya código escrito a mano
# duplicado. Se excluyen del cálculo de duplicación (CPD) y del análisis.
sonar.exclusions=**/Migrations/**
sonar.cpd.exclusions=**/Migrations/**
